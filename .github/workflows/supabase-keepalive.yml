# Mantiene activa la base de Supabase (plan gratis).
# Supabase pausa los proyectos gratuitos tras 7 días sin actividad. Esta tarea hace
# una consulta de solo lectura dos veces por semana para que eso no ocurra.
# Secreto necesario: SUPABASE_DB_URL (ver docs/RESPALDOS_SUPABASE.md).
name: Mantener Supabase activo

on:
  schedule:
    # Lunes y jueves a las 13:23 UTC (8:23 a. m. hora de Colombia).
    # Entre una ejecución y la siguiente pasan como máximo 4 días.
    - cron: "23 13 * * 1,4"
  workflow_dispatch: {}

permissions:
  actions: write   # solo para volver a habilitar las tareas programadas (ver último paso)
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          # Consulta de solo lectura. No imprime datos: solo confirma que respondió.
          for intento in 1 2 3; do
            if psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -qtAc "select 1 from public.users limit 1" >/dev/null; then
              echo "Supabase respondió correctamente (intento ${intento})."
              exit 0
            fi
            echo "Intento ${intento} falló; reintentando en 30 s..."
            sleep 30
          done
          echo "::error::No se pudo consultar Supabase. Revisa si el proyecto quedó pausado (Supabase → Restore) o si cambió la contraseña de la base."
          exit 1

      - name: Evitar que GitHub desactive las tareas programadas
        # En repositorios públicos, GitHub desactiva las tareas programadas tras 60 días
        # sin actividad en el repositorio. Volver a habilitarlas por la API lo evita.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in supabase-keepalive.yml supabase-backup.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable" >/dev/null \
              && echo "Tarea ${wf} habilitada." || echo "No se pudo habilitar ${wf} (no es grave)."
          done
